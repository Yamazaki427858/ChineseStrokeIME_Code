name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  release:
    types: [published, prereleased]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    # release 事件時務必對準該版本的 tag；push / PR 沿用預設 ref
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make

    - name: Build
      shell: msys2 {0}
      run: |
        mingw32-make

    # release 事件時 github.ref 多半是預設分支，ref_type 會是 branch；改用事件判斷才不會跳過打包
    - name: Package Release
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path ChineseStrokeIME
        Copy-Item ChineseStrokeIME.exe ChineseStrokeIME/
        Copy-Item user_dict.txt ChineseStrokeIME/
        Compress-Archive -Path ChineseStrokeIME -DestinationPath ChineseStrokeIME_Release.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: ChineseStrokeIME-Build
        path: ChineseStrokeIME.exe

    # 由 git push tag 觸發時：建立 Release 並附上 zip（軟體預設流程）
    - name: Create Release (git tag push)
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: ChineseStrokeIME_Release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 由網頁「發布 Release」觸發時：Release 已存在，只上傳／覆寫資產（避免與上一段重複 create）
    - name: Upload to Release (published from GitHub UI)
      if: github.event_name == 'release'
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" ChineseStrokeIME_Release.zip --clobber
