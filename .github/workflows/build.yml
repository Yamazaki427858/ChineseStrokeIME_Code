name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make

    - name: Build
      shell: msys2 {0}
      run: |
        mingw32-make

    # 修改：PowerShell 打包成zip
    - name: Package Release
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path ChineseStrokeIME
        Copy-Item ChineseStrokeIME.exe ChineseStrokeIME/
        Copy-Item user_dict.txt ChineseStrokeIME/
        Compress-Archive -Path ChineseStrokeIME -DestinationPath ChineseStrokeIME_Release.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: ChineseStrokeIME-Build
        path: ChineseStrokeIME.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: ChineseStrokeIME_Release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
